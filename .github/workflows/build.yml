name: Сборка APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Скачать игры
        run: ./scripts/fetch_games.sh

      - name: Собрать APK
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleRelease 2>&1 | tee build.log

      - name: Показать ошибки сборки
        if: failure()
        run: |
          grep -E "error|ERROR|FAILED|What went wrong|e: " build.log | head -30 | while IFS= read -r line; do
            echo "::error::$line"
          done

      - name: Переименовать APK
        run: cp app/build/outputs/apk/release/app-release.apk AndreosPlay.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AndreosPlay
          path: AndreosPlay.apk

      - name: Обновить релиз «latest»
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest AndreosPlay.apk \
            --title "Andreos Play (сборка ${{ github.run_number }})" \
            --notes "Скачай AndreosPlay.apk на телефон и установи. Новые версии ставятся поверх старой, прогресс сохраняется." \
            --target "${{ github.sha }}"
