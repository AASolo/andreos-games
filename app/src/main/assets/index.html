<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0914">
<title>Andreos Play</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
<div class="grain" aria-hidden="true"></div>

<div class="app">
  <header>
    <div class="logo" aria-hidden="true">
      <svg viewBox="22 22 64 64">
        <defs>
          <linearGradient id="logoNeon" x1="33" y1="30" x2="75" y2="76" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#35d0ff"/><stop offset=".5" stop-color="#8b5cff"/><stop offset="1" stop-color="#ff4f9a"/></linearGradient>
          <filter id="logoGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        </defs>
        <path class="neon" d="M33 76 L54 30 L75 76" fill="none" stroke="url(#logoNeon)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#logoGlow)"/>
        <path class="tri" d="M48 54 L48 70 L62 62 Z" fill="#fff" filter="url(#logoGlow)"/>
      </svg>
    </div>
    <div class="hello">
      <small id="greet">Привет!</small>
      <h1><span class="grad">Andreos</span> Play</h1>
    </div>
    <button class="bell" id="bellBtn" type="button" aria-label="Уведомления">
      <svg viewBox="0 0 24 24"><path d="M12 22a2.5 2.5 0 0 0 2.45-2h-4.9A2.5 2.5 0 0 0 12 22zm7-6V11a7 7 0 0 0-5.5-6.84V3.5a1.5 1.5 0 0 0-3 0v.66A7 7 0 0 0 5 11v5l-1.7 1.7A1 1 0 0 0 4 19.4h16a1 1 0 0 0 .7-1.7L19 16z"/></svg>
      <i class="count" id="bellCount" hidden></i>
    </button>
    <button class="streak" id="streakChip" type="button" aria-label="Серия дней"></button>
  </header>

  <div id="updateBanner" class="update" hidden></div>

  <!-- ====== Игры ====== -->
  <section class="tab" id="tab-games" data-tab="games">
    <button class="hero" id="hero" type="button"></button>

    <div class="chips" id="chips" role="tablist"></div>

    <div class="section-title"><h3 id="listTitle">Все игры</h3><span id="count"></span></div>
    <main class="grid" id="grid"></main>
    <div class="empty" id="empty" hidden>
      <div class="empty-heart">♡</div>
      <p>Нажми на сердечко у игры, и она появится здесь.</p>
    </div>
  </section>

  <!-- ====== Достижения ====== -->
  <section class="tab" id="tab-awards" data-tab="awards" hidden>
    <div class="profile">
      <div class="ring" id="ring">
        <svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" class="ring-bg"/><circle cx="60" cy="60" r="52" class="ring-fg" id="ringFg"/></svg>
        <div class="ring-text"><b id="ringNum">0</b><span>из 0</span></div>
      </div>
      <div class="stats" id="stats"></div>
    </div>
    <div class="section-title"><h3>Достижения</h3><span id="awardsCount"></span></div>
    <div class="awards" id="awards"></div>
    <div class="section-title"><h3>Время в играх</h3></div>
    <div class="bars" id="bars"></div>
  </section>

  <!-- ====== Настройки ====== -->
  <section class="tab" id="tab-settings" data-tab="settings" hidden>
    <div class="section-title first"><h3>Настройки</h3></div>
    <div class="list">
      <label class="row"><span class="ico">📳</span><span class="lbl">Вибрация<small>Отклик при нажатиях</small></span><input type="checkbox" class="switch" data-setting="haptics"></label>
      <label class="row"><span class="ico">🔊</span><span class="lbl">Звуки меню<small>Тихие щелчки в меню</small></span><input type="checkbox" class="switch" data-setting="sounds"></label>
      <label class="row"><span class="ico">🎵</span><span class="lbl">Фоновая музыка<small>Тихая спокойная мелодия в меню</small></span><input type="checkbox" class="switch" data-setting="music"></label>
      <label class="row"><span class="ico">🔔</span><span class="lbl">Напоминания<small>Не дадим сгореть серии дней</small></span><input type="checkbox" class="switch" data-setting="reminders"></label>
      <label class="row"><span class="ico">✨</span><span class="lbl">Анимации<small>Живой фон и эффекты</small></span><input type="checkbox" class="switch" data-setting="motion"></label>
    </div>
    <div class="list">
      <button class="row" type="button" id="shareBtn"><span class="ico">💌</span><span class="lbl">Поделиться с другом<small>Отправить ссылку на приложение</small></span><span class="chev">›</span></button>
      <button class="row" type="button" id="updateBtn"><span class="ico">🚀</span><span class="lbl">Проверить обновления<small id="versionLbl">Версия</small></span><span class="chev">›</span></button>
      <button class="row" type="button" data-open="https://www.instagram.com/misterandreos/"><span class="ico">📸</span><span class="lbl">Andreos в Instagram<small>Новые игры и закулисье</small></span><span class="chev">›</span></button>
      <button class="row" type="button" data-open="https://aasolo.github.io/misterandreos/"><span class="ico">🌐</span><span class="lbl">Сайт Andreos<small>Игры, приложения и сайты</small></span><span class="chev">›</span></button>
    </div>
    <div class="list">
      <button class="row danger" type="button" id="resetBtn"><span class="ico">🗑️</span><span class="lbl">Сбросить статистику<small>Время, серии и достижения</small></span></button>
    </div>
    <p class="made">Сделано Andreos с помощью ИИ ♥</p>
  </section>
</div>

<nav class="tabbar" id="tabbar">
  <button type="button" data-go="games" class="on">
    <svg viewBox="0 0 24 24"><path d="M7 6h10a6 6 0 0 1 6 6v2.5a4.5 4.5 0 0 1-8.1 2.6L13.8 15h-3.6l-1.1 2.1A4.5 4.5 0 0 1 1 14.5V12a6 6 0 0 1 6-6z"/></svg>
    <span>Игры</span>
  </button>
  <button type="button" data-go="awards">
    <svg viewBox="0 0 24 24"><path d="M7 3h10v2h3v3a5 5 0 0 1-4.6 5A5 5 0 0 1 13 15.9V18h3v3H8v-3h3v-2.1A5 5 0 0 1 8.6 13 5 5 0 0 1 4 8V5h3V3zm0 4H6v1a3 3 0 0 0 1.4 2.5A6 6 0 0 1 7 8V7zm10 0v1c0 .9-.1 1.7-.4 2.5A3 3 0 0 0 18 8V7h-1z"/></svg>
    <span>Награды</span><i class="dot" id="awardsDot" hidden></i>
  </button>
  <button type="button" data-go="settings">
    <svg viewBox="0 0 24 24"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7zm8.4 4.6.1-1.1-.1-1.1 2-1.6-2-3.4-2.4 1a8 8 0 0 0-1.9-1.1L15.7 3h-3.9l-.4 2.7a8 8 0 0 0-1.9 1.1l-2.4-1-2 3.4 2 1.6-.1 1.1.1 1.1-2 1.6 2 3.4 2.4-1c.6.5 1.2.8 1.9 1.1l.4 2.7h3.9l.4-2.7c.7-.3 1.3-.6 1.9-1.1l2.4 1 2-3.4-2-1.6z" transform="translate(-1.5 0)"/></svg>
    <span>Ещё</span>
  </button>
  <i class="tab-glow" id="tabGlow"></i>
</nav>

<div class="sheet-bg" id="sheetBg" hidden></div>
<section class="sheet" id="inbox" hidden aria-label="Уведомления">
  <div class="grab"></div>
  <div class="sheet-head"><h3>Уведомления</h3><button type="button" id="inboxClear">Очистить</button></div>
  <div class="inbox-list" id="inboxList"></div>
</section>

<div class="toasts" id="toasts"></div>
<canvas id="confetti" aria-hidden="true"></canvas>

<script src="app.js"></script>
</body>
</html>
