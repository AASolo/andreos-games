<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0914">
<title>Andreos Play</title>
<style>
  :root {
    --bg: #0b0914;
    --surface: rgba(255, 255, 255, .06);
    --surface-strong: rgba(255, 255, 255, .1);
    --stroke: rgba(255, 255, 255, .1);
    --text: #f6f3ff;
    --muted: #a79fc4;
    --brand-1: #8b5cff;
    --brand-2: #ff4f9a;
    --brand-3: #ffc42e;
    --radius: 24px;
    --pad: clamp(16px, 4vw, 40px);
    --ease-out: cubic-bezier(.16, 1, .3, 1);
    --ease-spring: cubic-bezier(.34, 1.56, .64, 1);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: system-ui, -apple-system, "Roboto", "Segoe UI", sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-user-select: none; user-select: none;
  }
  img { -webkit-user-drag: none; }

  /* ---------- живой фон ---------- */
  .aurora { position: fixed; inset: -20%; z-index: 0; filter: blur(70px); opacity: .55; pointer-events: none; }
  .aurora i {
    position: absolute; width: 50vmax; height: 50vmax; border-radius: 50%;
    animation: drift 22s ease-in-out infinite alternate;
  }
  .aurora i:nth-child(1) { background: var(--brand-1); left: 0; top: 0; }
  .aurora i:nth-child(2) { background: var(--brand-2); right: 0; top: 20%; animation-duration: 28s; animation-delay: -8s; }
  .aurora i:nth-child(3) { background: #1fb8ff; left: 20%; bottom: 0; animation-duration: 32s; animation-delay: -14s; opacity: .7; }
  @keyframes drift {
    0%   { transform: translate(0, 0) scale(1); }
    50%  { transform: translate(12vw, 8vh) scale(1.15); }
    100% { transform: translate(-8vw, 14vh) scale(.9); }
  }
  .grain {
    position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: .06;
    background-image: radial-gradient(rgba(255,255,255,.8) 1px, transparent 1px);
    background-size: 3px 3px;
  }

  .app {
    position: relative; z-index: 1;
    max-width: 1280px; margin: 0 auto;
    padding:
      calc(env(safe-area-inset-top) + clamp(18px, 4vh, 40px))
      calc(env(safe-area-inset-right) + var(--pad))
      calc(env(safe-area-inset-bottom) + 32px)
      calc(env(safe-area-inset-left) + var(--pad));
  }

  /* ---------- шапка ---------- */
  header { display: flex; align-items: center; gap: 14px; margin-bottom: clamp(18px, 3vh, 32px); }
  .logo {
    width: 48px; height: 48px; border-radius: 15px; flex: none;
    background: linear-gradient(135deg, var(--brand-1), var(--brand-2));
    display: grid; place-items: center;
    box-shadow: 0 8px 24px rgba(139, 92, 255, .45);
    animation: logoIn .9s var(--ease-spring) both;
  }
  .logo svg { width: 28px; height: 28px; }
  @keyframes logoIn { from { transform: scale(0) rotate(-30deg); } to { transform: none; } }
  .hello { min-width: 0; }
  .hello small { display: block; color: var(--muted); font-size: 14px; animation: rise .7s var(--ease-out) .1s both; }
  .hello h1 {
    margin: 0; font-size: clamp(24px, 6vw, 34px); font-weight: 850; letter-spacing: -.03em; line-height: 1.1;
    animation: rise .7s var(--ease-out) .18s both;
  }
  .grad {
    background: linear-gradient(90deg, var(--brand-1), var(--brand-2), var(--brand-3), var(--brand-1));
    background-size: 300% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: shine 8s linear infinite;
  }
  @keyframes shine { to { background-position: 300% 0; } }
  @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }

  /* ---------- главный баннер ---------- */
  .hero {
    position: relative; display: grid; grid-template-columns: 1fr; width: 100%;
    border: 1px solid var(--stroke); padding: 0; text-align: left; color: inherit; font: inherit;
    border-radius: calc(var(--radius) + 6px); overflow: hidden; cursor: pointer;
    background: rgba(12, 10, 22, .55);
    box-shadow: 0 30px 70px -28px var(--accent, var(--brand-1));
    animation: heroIn .9s var(--ease-out) .25s both;
    transition: transform .25s var(--ease-out);
    isolation: isolate;
  }
  @keyframes heroIn { from { opacity: 0; transform: translateY(30px) scale(.96); } to { opacity: 1; transform: none; } }
  .hero .backdrop {
    position: absolute; inset: -40px; z-index: -1; width: calc(100% + 80px); height: calc(100% + 80px);
    object-fit: cover; filter: blur(40px) saturate(1.4); opacity: .45;
  }
  .hero .frame { position: relative; aspect-ratio: 1200 / 630; overflow: hidden; }
  .hero .frame img {
    width: 100%; height: 100%; object-fit: cover; display: block;
    animation: kenburns 16s ease-in-out infinite alternate;
  }
  @keyframes kenburns { from { transform: scale(1); } to { transform: scale(1.08); } }
  .hero .frame .pill { position: absolute; top: 12px; left: 12px; }
  .hero .body {
    display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px;
    padding: clamp(14px, 3.5vw, 26px);
  }
  .hero .text { flex: 1 1 220px; min-width: 0; }
  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
    padding: 6px 11px; border-radius: 999px;
    background: rgba(11, 9, 20, .55); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  }
  .pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent); animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(1.6); opacity: .5; } }
  .hero h2 { margin: 0 0 4px; font-size: clamp(22px, 5.5vw, 34px); font-weight: 850; letter-spacing: -.03em; line-height: 1.1; }
  .hero p { margin: 0; color: rgba(255, 255, 255, .75); font-size: clamp(14px, 3.4vw, 16px); max-width: 52ch; }
  .play {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 12px 22px; border-radius: 999px; font-weight: 800; font-size: 16px;
    background: #fff; color: #0b0914;
    box-shadow: 0 10px 30px -8px var(--accent);
  }
  .play svg { width: 18px; height: 18px; }

  /* ---------- сетка игр ---------- */
  .section-title {
    display: flex; align-items: baseline; justify-content: space-between;
    margin: clamp(26px, 4vh, 40px) 2px 14px;
    animation: rise .7s var(--ease-out) .4s both;
  }
  .section-title h3 { margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -.02em; }
  .section-title span { color: var(--muted); font-size: 14px; }

  .grid { display: grid; gap: clamp(12px, 2.5vw, 20px); grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); }
  .card {
    position: relative; display: flex; flex-direction: column; width: 100%;
    border: 1px solid var(--stroke); padding: 0; text-align: left; color: inherit; font: inherit;
    background: var(--surface); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    border-radius: var(--radius); overflow: hidden; cursor: pointer;
    opacity: 0; transform: translateY(26px) scale(.97);
    transition: transform .35s var(--ease-out), box-shadow .35s var(--ease-out), border-color .35s;
  }
  .card.in { animation: cardIn .7s var(--ease-out) forwards; animation-delay: calc(var(--i) * 80ms + 420ms); }
  @keyframes cardIn { to { opacity: 1; transform: none; } }
  .card .cover-wrap { position: relative; aspect-ratio: 1200 / 630; overflow: hidden; }
  .card .cover-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .6s var(--ease-out); }
  .card .cover-wrap::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(115deg, transparent 30%, rgba(255, 255, 255, .25) 45%, transparent 60%);
    transform: translateX(-100%);
  }
  .card.in .cover-wrap::after { animation: sweep 1.2s var(--ease-out) calc(var(--i) * 80ms + 900ms); }
  @keyframes sweep { to { transform: translateX(100%); } }
  .card .info { display: flex; align-items: center; gap: 12px; padding: 14px 14px 14px 16px; }
  .card .text { flex: 1; min-width: 0; }
  .card h4 { margin: 0 0 3px; font-size: 17px; font-weight: 800; letter-spacing: -.01em; }
  .card p { margin: 0; color: var(--muted); font-size: 13.5px; line-height: 1.35; }
  .card .go {
    flex: none; width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center;
    background: var(--accent); color: #0b0914;
    box-shadow: 0 6px 18px -4px var(--accent);
    transition: transform .35s var(--ease-spring);
  }
  .card .go svg { width: 18px; height: 18px; margin-left: 2px; }
  .card .badge {
    position: absolute; top: 10px; left: 10px;
    font-size: 11px; font-weight: 800; padding: 5px 9px; border-radius: 999px;
    background: rgba(11, 9, 20, .65); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  @media (hover: hover) {
    .card:hover { transform: translateY(-4px); border-color: rgba(255, 255, 255, .22); box-shadow: 0 20px 40px -18px var(--accent); }
    .card:hover .cover-wrap img { transform: scale(1.06); }
    .card:hover .go { transform: scale(1.12) rotate(-8deg); }
    .hero:hover { transform: translateY(-3px); }
  }
  .card:active, .hero:active { transform: scale(.97); transition-duration: .12s; }

  footer { margin-top: 32px; text-align: center; color: var(--muted); font-size: 13px; animation: rise .7s var(--ease-out) .9s both; }

  /* ---------- переход в игру ---------- */
  .zoom {
    position: fixed; z-index: 50; overflow: hidden; pointer-events: none;
    transition: all .55s var(--ease-out);
  }
  .zoom img { width: 100%; height: 100%; object-fit: cover; }
  .zoom .veil { position: absolute; inset: 0; background: var(--accent); opacity: 0; transition: opacity .35s ease .25s; }
  .zoom.full .veil { opacity: 1; }
  .zoom .spinner {
    position: absolute; left: 50%; top: 50%; width: 44px; height: 44px; margin: -22px;
    border-radius: 50%; border: 4px solid rgba(255,255,255,.35); border-top-color: #fff;
    opacity: 0; transition: opacity .2s ease .45s; animation: spin .8s linear infinite;
  }
  .zoom.full .spinner { opacity: 1; }
  @keyframes spin { to { transform: rotate(360deg); } }
  body.leaving .app { transition: opacity .3s, transform .4s var(--ease-out); opacity: 0; transform: scale(.96); }

  /* ---------- адаптация ---------- */
  /* Телефон горизонтально и планшеты: баннер и подпись рядом */
  @media (min-width: 640px) and (orientation: landscape), (min-width: 900px) {
    .hero { grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); align-items: center; }
    .hero .body { flex-direction: column; align-items: flex-start; gap: 18px; padding: clamp(18px, 3vw, 40px); }
    .hero .text { flex: none; }
    .hero h2 { font-size: clamp(24px, 3.4vw, 44px); }
  }
  /* Низкие экраны (телефон боком): компактнее */
  @media (max-height: 500px) {
    header { margin-bottom: 12px; }
    .logo { width: 40px; height: 40px; border-radius: 12px; }
    .hero .frame { max-height: 64vh; }
    .section-title { margin-top: 20px; }
  }
  /* Очень узкие экраны */
  @media (max-width: 340px) {
    .card .go { width: 36px; height: 36px; }
    .play { padding: 10px 16px; font-size: 15px; }
  }
  /* Без анимаций, если они выключены в системе */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    .card { opacity: 1; transform: none; }
  }
</style>
</head>
<body>
<div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
<div class="grain" aria-hidden="true"></div>

<div class="app">
  <header>
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none"><path fill="#fff" d="M7 6h10a6 6 0 0 1 6 6v2.5a4.5 4.5 0 0 1-8.1 2.6L13.8 15h-3.6l-1.1 2.1A4.5 4.5 0 0 1 1 14.5V12a6 6 0 0 1 6-6z"/><path fill="#8b5cff" d="M6 9.5h1.5V11H9v1.5H7.5V14H6v-1.5H4.5V11H6z"/><circle cx="16.5" cy="10.5" r="1.2" fill="#ffc42e"/><circle cx="19" cy="13" r="1.2" fill="#ff4f9a"/></svg>
    </div>
    <div class="hello">
      <small id="greet">Привет!</small>
      <h1><span class="grad">Andreos</span> Play</h1>
    </div>
  </header>

  <button class="hero" id="hero" type="button"></button>

  <div class="section-title"><h3>Все игры</h3><span id="count"></span></div>
  <main class="grid" id="grid"></main>

  <footer>Сделано Andreos с помощью ИИ</footer>
</div>

<script>
  const PLAY = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l11-6.5a1 1 0 0 0 0-1.72l-11-6.5A1 1 0 0 0 8 5.5z"/></svg>';

  const games = [
    { id: "doroga-v-okean", title: "Дорога в океан", cover: "og.jpg", accent: "#35d0ba",
      text: "Вырасти малька за 30 дней заботы и открой ему дорогу в океан.", tag: "Уютная" },
    { id: "ButerBashnya-1.0", title: "Бутербашня", cover: "og-image.png", accent: "#ffc42e",
      text: "Построй башню из бургеров до самого космоса.", tag: "Аркада" },
    { id: "kimchi-gleba", title: "Кимчи-кафе Глеба Ли", cover: "og.jpg", accent: "#ff7a2f",
      text: "Собери кимчи по рецепту и накорми гостей.", tag: "Кулинария" },
    { id: "HackQuest-3.0", title: "HackQuest", cover: "og-image.png", accent: "#2bff7a",
      text: "Хакерская игра: 30 миссий на Python и секретный проект OBELISK.", tag: "Python" },
  ];
  const url = g => `games/${g.id}/index.html`;
  const img = g => `games/${g.id}/${g.cover}`;

  const store = {
    get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  };

  // Приветствие по времени суток
  const h = new Date().getHours();
  document.getElementById("greet").textContent =
    h < 5 ? "Доброй ночи!" : h < 12 ? "Доброе утро!" : h < 18 ? "Добрый день!" : "Добрый вечер!";

  // Баннер: последняя игра или новинка
  const recent = store.get("ap:recent", []);
  const last = games.find(g => g.id === recent[0]);
  const featured = last || games[0];
  const hero = document.getElementById("hero");
  hero.style.setProperty("--accent", featured.accent);
  hero.innerHTML = `
    <img class="backdrop" src="${img(featured)}" alt="">
    <div class="frame">
      <img src="${img(featured)}" alt="">
      <span class="pill"><span class="dot"></span>${last ? "Ты играл недавно" : "Новинка"}</span>
    </div>
    <div class="body">
      <div class="text"><h2></h2><p></p></div>
      <span class="play">${PLAY}${last ? "Продолжить" : "Играть"}</span>
    </div>`;
  hero.querySelector("h2").textContent = featured.title;
  hero.querySelector("p").textContent = featured.text;
  hero.addEventListener("click", () => launch(featured, hero.querySelector(".frame img"), hero));

  // Карточки
  const grid = document.getElementById("grid");
  const n = games.length, m10 = n % 10, m100 = n % 100;
  document.getElementById("count").textContent = `${n} ${m10 === 1 && m100 !== 11 ? "игра" : m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14) ? "игры" : "игр"}`;
  games.forEach((g, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "card";
    b.style.setProperty("--i", i);
    b.style.setProperty("--accent", g.accent);
    b.innerHTML = `
      <div class="cover-wrap"><img src="${img(g)}" alt="" loading="lazy"><span class="badge"></span></div>
      <div class="info"><div class="text"><h4></h4><p></p></div><span class="go">${PLAY}</span></div>`;
    b.querySelector("h4").textContent = g.title;
    b.querySelector("p").textContent = g.text;
    b.querySelector(".badge").textContent = recent.includes(g.id) ? "Недавно" : g.tag;
    b.addEventListener("click", () => launch(g, b.querySelector("img"), b));
    grid.appendChild(b);
  });

  // Карточки появляются, когда доезжают до экрана
  const io = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); }
  }), { rootMargin: "0px 0px -5% 0px" });
  document.querySelectorAll(".card").forEach(c => io.observe(c));

  // Запуск: обложка раскрывается на весь экран, потом открывается игра
  let busy = false;
  function launch(g, coverImg, el) {
    if (busy) return; busy = true;
    try { navigator.vibrate && navigator.vibrate(12); } catch {}
    store.set("ap:recent", [g.id, ...recent.filter(x => x !== g.id)].slice(0, 4));

    const r = coverImg.getBoundingClientRect();
    const z = document.createElement("div");
    z.className = "zoom";
    z.style.setProperty("--accent", g.accent);
    Object.assign(z.style, { left: r.left + "px", top: r.top + "px", width: r.width + "px", height: r.height + "px", borderRadius: "24px" });
    z.innerHTML = `<img src="${coverImg.src}" alt=""><div class="veil"></div><div class="spinner"></div>`;
    document.body.appendChild(z);
    document.body.classList.add("leaving");
    requestAnimationFrame(() => requestAnimationFrame(() => {
      z.classList.add("full");
      Object.assign(z.style, { left: 0, top: 0, width: "100vw", height: "100vh", borderRadius: 0 });
    }));
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    setTimeout(() => { location.href = url(g); }, reduce ? 0 : 560);
  }

  // Вернулись «Назад» из игры: убираем следы перехода
  addEventListener("pageshow", e => {
    if (!e.persisted) return;
    busy = false;
    document.querySelectorAll(".zoom").forEach(z => z.remove());
    document.body.classList.remove("leaving");
  });
</script>
</body>
</html>
